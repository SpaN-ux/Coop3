; CoopVC. Put this next to CoopVC.asi.
;
; Every line here is optional. With no file at all CoopVC connects to a server
; on this machine as "Player", which is a working single-machine setup.

[CoopVC]

; Server to connect to. Hostname or IP.
host = 127.0.0.1

; Server port. Must match the server's.
port = 2002

; Your name, as other players see it. Up to 23 characters; control characters
; are stripped.
nick = Player

; Write CoopVC.log next to the .asi. Leave this on unless you have a reason:
; with an ASI loader, SilentPatch, Mod Loader and CLEO all patching the same
; game, the log is usually the only thing that explains a failed start.
logToFile = true

; How big the names over other players are drawn, as a multiple of the
; built-in size. The built-in one is a fixed fraction of screen height, so it
; already looks the same at any resolution; this is just taste. Between 0.25
; and 4.0, anything outside that is ignored.
nametagScale = 1.0

; Which key asks for a passenger seat in somebody else's car.
seatKey = G

; Yes and no when somebody picks up a rampage skull and asks the session. Only
; read while that question is on screen. A letter, a digit or F1-F12.
voteYesKey = Y
voteNoKey = N

; The chat. chatKey opens a line to type (Enter sends it, Escape drops it). A
; letter, a digit or F1-F12.
chatKey = T

; The scoreboard, everyone in the session: up while scoreboardKey is held,
; and listKey pins it up or lets it go. A letter, a digit, F1-F12 or Tab.
;scoreboardKey = TAB
listKey = F9

; Show the CoopVC version in the bottom-left corner of the screen.
showVersion = true

; Share the missions with everybody in the session: one at a time, nobody
; left behind at the start or at a checkpoint, and a death failing it for all.
; On by default. `missions = false` keeps every mission this machine's own.
missions = true

; Show the game as CoopVC in Discord ("Playing CoopVC") instead of Grand Theft
; Auto: Vice City, with whether you are in a session, its mission and how many are in
; it. Nothing about the server or anybody's name goes to Discord. Without the
; Discord app running this does nothing. The launcher has the same switch.
discordPresence = true

; The Discord application to show as. Leave it out to use CoopVC's own.
;discordAppId =

; The server's password, if whoever runs it set one. Leave it out otherwise.
;password =
